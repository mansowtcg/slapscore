# Despliegue en Cloudflare Workers (gratis). Lo hace el flujo de GitHub Actions si existen
# los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Ver README.
name = "slapscore"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "none"

[vars]
GH_REPO = "mansowtcg/slapscore"

[triggers]
crons = ["7,37 * * * *"]

# Estadísticas de visitas: Durable Object con SQLite (incluido en el plan gratuito)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]
