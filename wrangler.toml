# Despliegue en Cloudflare Workers (gratis). Lo hace el flujo de GitHub Actions si existen
# los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Ver README.
name = "slapscore"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false   # solo slapscore.app y www.slapscore.app (dominios del Worker en Cloudflare)

[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "none"

[vars]
GH_REPO = "mansowtcg/slapscore"

# Avisos por email al administrador (alerts.js): solo puede escribir a direcciones verificadas en Email Routing
[[send_email]]
name = "MAIL"

[triggers]
crons = ["7,37 * * * *", "*/3 * * * *"]

# Durable Objects con SQLite (incluidos en el plan gratuito):
# Stats: estadísticas de visitas. Push: avisos en el móvil (suscripciones, claves VAPID y avisos ya enviados)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "PUSH"
class_name = "Push"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Push"]
