name: Rastrear partidos

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  schedule:
    - cron: '7,37 * * * *'   # cada 30 minutos
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos de rastreo en esta ejecución'
        default: '8'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rastrear slapshot.gg
        env:
          MINUTES: ${{ github.event.inputs.minutes || '8' }}
          MAX_REQUESTS: '150'
        run: TIME_BUDGET_MS=$(( MINUTES * 60000 )) node crawler/crawl.mjs
      - name: Guardar datos en el repo
        run: |
          git config user.name "slapscore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
