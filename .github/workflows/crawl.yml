name: Rastrear partidos
# Las pasadas automáticas van encadenadas: al terminar, cada pasada pone en cola la siguiente.
# El reloj de GitHub (schedule) y el Worker de Cloudflare solo sirven para relanzar la cadena si se corta.
run-name: ${{ inputs.chain == '1' && 'Pasada automática' || '' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos de rastreo en esta pasada'
        default: '8'
      chain:
        description: 'Pasada automática encadenada (1) o manual (0)'
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # el robot no necesita la credencial de GitHub en disco (solo la usa «Guardar datos», en su propia copia)
          persist-credentials: false
      - name: Comprobar
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          # El reloj de GitHub solo hace falta si la cadena se ha cortado: si hay otra pasada en marcha o reciente, no repetir
          if [ "${{ github.event_name }}" = "schedule" ]; then
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow crawl.yml --limit 10 --json databaseId,createdAt,status \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\" or (now - (.createdAt | fromdateiso8601)) < 1380)] | length" || echo 0)
            if [ "${busy:-0}" -gt 0 ]; then go=false; echo "Hay otra pasada en marcha o reciente: esta se salta."; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "cf=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Bajar datos
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          # Wrangler (Publicar en Cloudflare) necesita Node 22 o superior
          node-version: 22
      - name: Rastrear slapshot.gg
        if: steps.gate.outputs.go == 'true'
        env:
          # encadenadas: 3 min (9 peticiones/min, el límite de slapshot.gg es 10) y se publica; así la web se actualiza cada 3-4 min
          # a mano: lo que se pida a 9/min; cambios de ajustes: 1 min
          MINUTES: ${{ inputs.chain == '1' && '3' || github.event.inputs.minutes || (github.event_name == 'push' && '1') || '8' }}
          GAP_MS: ${{ inputs.chain == '1' && '6500' || '6700' }}
          MAX_REQUESTS: '200'
        run: |
          # solo un número entero (la aritmética de bash ejecutaría lo que viniera dentro)
          case "$MINUTES" in ''|*[!0-9]*) echo "Minutos no válidos: se usan 3"; MINUTES=3 ;; esac
          [ "$MINUTES" -gt 40 ] && MINUTES=40
          TIME_BUDGET_MS=$(( MINUTES * 60000 )) node --max-old-space-size=6144 crawler/crawl.js
      - name: Liga EUSL
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: node crawler/eusl.js
      - name: Subir el archivo
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Partidos completos que salen de la web: un archivo por día en la publicación "archivo-AAAA-MM"
          shopt -s nullglob
          for f in data/_int/outbox/*.json.gz; do
            day=$(basename "$f" .json.gz); tag="archivo-${day:0:7}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Archivo de partidos · ${day:0:7}" \
              --notes "Partidos completos de slapshot.gg guardados por SlapScore (un archivo JSON comprimido por día, hora de Madrid)." --latest=false || continue
            cp "$f" "$RUNNER_TEMP/partidos-$day.json.gz"
            if gh release upload "$tag" "$RUNNER_TEMP/partidos-$day.json.gz" --clobber; then rm "$f"; echo "Archivado $day"; fi
          done
      - name: Guardar datos
        if: steps.gate.outputs.go == 'true'
        working-directory: data
        run: |
          git config user.name "slapscore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan nuevo
          git add -A
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin nuevo:data
      - name: Preparar la web
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets config _headers .well-known _site/
          cp -r data _site/data
          rm -rf _site/data/.git _site/data/_int
          B="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$B/g" _site/sw.js
          sed -i -E "s#assets/(app\.js|core\.js|emblems\.js|i18n\.js|style\.css)\"#assets/\1?b=$B\"#g" _site/index.html
          sed -i -E "s#from '\./(core|emblems|i18n)\.js'#from './\1.js?b=$B'#g; s#import\('\./(admin|vendor/gunzip|en|share|traffic|legal)\.js'\)#import('./\1.js?b=$B')#g" _site/assets/*.js
          echo "Archivos: $(find _site -type f | wc -l) · tamaño: $(du -sh _site | cut -f1)"
      # La web está en https://slapscore.app (Cloudflare Workers). GitHub Pages ya no se usa.
      - name: Publicar la web (Cloudflare)
        id: deploy
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          # Cabeceras (caché y seguridad): archivo _headers del repositorio
          WR="npx -y wrangler@4.146.0"
          # Buzón de sugerencias: almacén KV "slapscore-feedback" (se crea solo la primera vez)
          kv_id() { $WR kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const j=JSON.parse(s.slice(s.search(/^\[/m)));const x=j.find((n)=>n.title==="slapscore-feedback");if(x)process.stdout.write(x.id)}catch{}})'; }
          KV=$(kv_id)
          if [ -z "$KV" ]; then $WR kv namespace create slapscore-feedback || true; KV=$(kv_id); fi
          if [ -n "$KV" ]; then printf '\n[[kv_namespaces]]\nbinding = "FEEDBACK"\nid = "%s"\n' "$KV" >> wrangler.toml; echo "Buzón: KV $KV"
          else echo "::warning::No se pudo preparar el almacén del buzón: el token de Cloudflare necesita el permiso Workers KV Storage (Edit)."; fi
          SEC=""
          if [ -n "$DISPATCH_TOKEN" ]; then SEC="$RUNNER_TEMP/cf.env"; printf 'GH_DISPATCH_TOKEN=%s\n' "$DISPATCH_TOKEN" > "$SEC"; fi
          if ! $WR deploy --var "GH_REPO:$GITHUB_REPOSITORY" ${SEC:+--secrets-file "$SEC"}; then
            # si Cloudflare no deja usar el envío de emails (avisos), se publica sin él para que la web no se quede atrás
            echo "::warning::No se pudo publicar con el envío de emails (avisos al administrador). Se publica sin él."
            node -e 'const f="wrangler.toml",fs=require("fs");fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/\[\[send_email\]\][^\[]*/,""))'
            $WR deploy --var "GH_REPO:$GITHUB_REPOSITORY" ${SEC:+--secrets-file "$SEC"}
          fi
          rm -f "$RUNNER_TEMP/cf.env"
      - name: Programar la siguiente pasada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si esta pasada ha fallado antes de publicar la web, se espera un poco para no repetir el fallo en bucle.
          # Si la web sí se ha publicado (p. ej. solo ha fallado la liga EUSL), se sigue al ritmo normal.
          if [ "${{ job.status }}" != "success" ] && [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "Esta pasada no ha ido bien: la siguiente, en 5 minutos."; sleep 300
          fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow crawl.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length" || echo 0)
          if [ "${others:-0}" -gt 0 ]; then echo "Ya hay otra pasada en cola: ella programará la siguiente."; exit 0; fi
          # GitHub a veces responde con un error pasajero (500): se reintenta antes de dar la cadena por cortada
          for i in 1 2 3 4 5; do
            if gh workflow run crawl.yml -R "$GITHUB_REPOSITORY" --ref main -f chain=1 -f minutes=3; then echo "Siguiente pasada en cola."; exit 0; fi
            echo "No se pudo poner en cola (intento $i). Reintento en $(( i * 20 )) s."; sleep $(( i * 20 ))
          done
          exit 1
