<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SlapScore</title>
<meta name="description" content="Resultados, estadísticas y notas de los partidos de Slapshot: Rebound.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky marcador con líneas de pista (azul · roja · azul), columna central de 1120px; en escritorio lista + carril derecho, en móvil una columna */
:root{
  --bg:#EBF0F5; --surface:#FFFFFF; --surface-2:#F3F6FA; --line:#D5DEE8; --line-strong:#B6C4D3;
  --fg:#0C1727; --muted:#56677B; --faint:#8494A7;
  --rink-red:#CF2339; --rink-blue:#2B5DD6; --link:#1B4EC0;
  --home:#2D69E3; --home-soft:#E2EBFC; --away:#E26A17; --away-soft:#FCEADC;
  --r-bad:#D7392A; --r-meh:#EC861C; --r-ok:#D8A70C; --r-good:#21A048; --r-great:#168DAC; --r-elite:#3B46CF; --r-ink:#FFFFFF; --r-ok-ink:#1F1800;
  --win:#1E9645; --loss:#CF392D; --draw:#8494A7;
  --av-s:52%; --av-l:44%;
  --shadow:0 1px 0 rgba(12,23,39,.04),0 1px 3px rgba(12,23,39,.07);
  --font-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09101B; --surface:#101928; --surface-2:#162133; --line:#213049; --line-strong:#33455F;
  --fg:#E4EBF4; --muted:#93A3B7; --faint:#6A7B91;
  --rink-red:#EF4A5F; --rink-blue:#5D88F1; --link:#8BADF8;
  --home:#5F90F3; --home-soft:#182A49; --away:#F38D40; --away-soft:#3A2414;
  --r-bad:#E0483A; --r-meh:#EE942E; --r-ok:#E2B71F; --r-good:#2DB357; --r-great:#20A4C4; --r-elite:#6670EA; --r-ink:#FFFFFF; --r-ok-ink:#1F1800;
  --win:#36B862; --loss:#EC5547; --draw:#6A7B91;
  --av-s:42%; --av-l:38%;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09101B; --surface:#101928; --surface-2:#162133; --line:#213049; --line-strong:#33455F;
  --fg:#E4EBF4; --muted:#93A3B7; --faint:#6A7B91;
  --rink-red:#EF4A5F; --rink-blue:#5D88F1; --link:#8BADF8;
  --home:#5F90F3; --home-soft:#182A49; --away:#F38D40; --away-soft:#3A2414;
  --r-bad:#E0483A; --r-meh:#EE942E; --r-ok:#E2B71F; --r-good:#2DB357; --r-great:#20A4C4; --r-elite:#6670EA; --r-ink:#FFFFFF; --r-ok-ink:#1F1800;
  --win:#36B862; --loss:#EC5547; --draw:#6A7B91;
  --av-s:42%; --av-l:38%;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rink-blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 24px;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:9px;color:var(--fg);text-decoration:none!important;padding-bottom:10px}
.puck{width:26px;height:16px;border-radius:50%;background:var(--fg);position:relative;box-shadow:inset 0 -3px 0 rgba(255,255,255,.12)}
.puck::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:2px;border-radius:2px;background:var(--rink-red)}
.brand-t{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand-t b{color:var(--rink-red);font-weight:800}
.nav{display:flex;gap:4px;align-self:stretch;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;padding:0 12px 10px;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none!important}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--rink-red)}
.top-tools{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.gsearch{position:relative}
.gsearch input{width:210px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 10px}
.gs-list{position:absolute;right:0;top:40px;width:260px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:30}
.gs-list a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;color:var(--fg);text-decoration:none!important}
.gs-list a:hover,.gs-list a.on{background:var(--surface-2)}
.gs-empty{padding:8px;color:var(--muted)}
.btn-up{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-weight:600;white-space:nowrap;text-decoration:none!important}
@media (max-width:860px){
  .top-in{grid-template-columns:1fr auto;padding-top:8px}
  .nav{grid-column:1/-1;grid-row:2;margin-inline:-8px}
  .top-tools{padding-bottom:0}
  .brand{padding-bottom:0}
  .gsearch input{width:150px}
}
.up-s{display:none}
@media (max-width:560px){.up-l{display:none}.up-s{display:inline}}
@media (max-width:420px){.gsearch input{width:120px}.btn-up{padding:0 10px}}

/* ---------- general ---------- */
main{padding-block:20px 56px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:12px 16px;margin-bottom:18px;color:var(--muted)}
.banner strong{color:var(--fg)}
.banner .grow{flex:1 1 280px;min-width:0}
.h-sec{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.h-page{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none!important;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:12px;color:var(--muted);font-weight:600}

/* nota (rating) */
.rt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 5px;border-radius:5px;font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1;color:var(--r-ink);background:var(--r-good);letter-spacing:.01em}
.rt.bad{background:var(--r-bad)}.rt.meh{background:var(--r-meh)}.rt.ok{background:var(--r-ok);color:var(--r-ok-ink)}.rt.good{background:var(--r-good)}.rt.great{background:var(--r-great)}.rt.elite{background:var(--r-elite)}
.rt.big{min-width:58px;height:40px;font-size:26px;border-radius:8px}
.rt.mid{min-width:44px;height:28px;font-size:19px;border-radius:6px}
.av{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h,210) var(--av-s) var(--av-l));color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase}
.av.lg{width:64px;height:64px;font-size:28px}
.av.md{width:40px;height:40px;font-size:17px}
.tdot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--home)}
.tdot.away{background:var(--away)}
.res{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;background:var(--draw)}
.res.W{background:var(--win)}.res.L{background:var(--loss)}

/* ---------- lista de partidos ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.filters{display:grid;grid-template-columns:minmax(160px,1.6fr) repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}}
.day{margin-bottom:16px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.day-h span{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.day-h small{color:var(--muted)}
.mrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;color:var(--fg);text-decoration:none!important;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--surface-2)}
.card > .mrow:first-child{border-radius:12px 12px 0 0}.card > .mrow:last-child{border-radius:0 0 12px 12px}
.mr-time{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12px;border-right:1px solid var(--line);padding-right:10px}
.mr-time span{font-weight:600;color:var(--fg);font-size:13px}
.mr-time small{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mr-time small.ot{color:var(--rink-red)}
.mr-teams{display:flex;flex-direction:column;gap:3px;min-width:0}
.mr-team{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted)}
.mr-team.won{color:var(--fg);font-weight:600}
.mr-names{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-names i{font-style:normal;color:var(--faint);margin:0 5px}
.mr-names .hl{color:var(--link);font-weight:700}
.mr-score{font-family:var(--font-display);font-weight:700;font-size:18px;width:22px;text-align:right}
.mr-meta{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px}
.mr-cap{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rail{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.kpis div{padding:12px 6px;border-left:1px solid var(--line)}
.kpis div:first-child{border-left:0}
.kpis b{display:block;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
.kpis span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lrow{display:grid;grid-template-columns:18px 28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);color:var(--fg);text-decoration:none!important}
.lrow:first-of-type{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow .n{color:var(--faint);font-weight:600;font-size:12px;text-align:right}
.lrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lrow .v{font-family:var(--font-display);font-weight:700;font-size:17px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 8px}
.card-h h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.card-h small{color:var(--muted)}

/* ---------- partido ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.board-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;background:var(--surface-2)}
.board-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start;padding:18px 16px}
.bt{display:flex;flex-direction:column;gap:6px;min-width:0}
.bt.away{align-items:flex-end;text-align:right}
.bt-lbl{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.bt.home .bt-lbl{color:var(--home)}.bt.away .bt-lbl{color:var(--away)}
.bt ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.bt li{display:flex;align-items:center;gap:8px;min-width:0}
.bt.away li{flex-direction:row-reverse}
.bt li button{all:unset;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt li button:hover{text-decoration:underline}
.bt li button:focus-visible{outline:2px solid var(--rink-blue);outline-offset:2px}
.bs{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.bs-score{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:54px;line-height:.9;letter-spacing:.01em}
.bs-score .lose{color:var(--faint)}
.bs-score .dash{font-weight:500;color:var(--faint);font-size:36px}
.bs-status{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bs-status.ot{color:var(--rink-red)}
@media (max-width:560px){.bs-score{font-size:42px}.board-main{gap:8px;padding:14px 12px}.bt li .rt{min-width:30px;font-size:13px;height:20px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--rink-red)}
.tabs button:focus-visible{outline:2px solid var(--rink-blue)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mvp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;cursor:pointer}
.mvp:hover{background:var(--surface-2)}
.mvp .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rink-red)}
.mvp .nm{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvp .ln{color:var(--muted);font-size:13px}
.cmp{padding:6px 16px 14px}
.cmp-row{padding:8px 0;border-top:1px solid var(--line)}
.cmp-row:first-child{border-top:0}
.cmp-top{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;font-weight:600}
.cmp-top span:first-child{text-align:left}.cmp-top span:last-child{text-align:right}
.cmp-top em{font-style:normal;text-align:center;color:var(--muted);font-size:12.5px;font-weight:500}
.cmp-top .lead{font-family:var(--font-display);font-size:17px;font-weight:700}
.cmp-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.cmp-bars div{height:6px;border-radius:3px;background:var(--surface-2);display:flex;overflow:hidden}
.cmp-bars div:first-child{justify-content:flex-end}
.cmp-bars i{display:block;height:100%;border-radius:3px;background:var(--home);opacity:.35}
.cmp-bars div:last-child i{background:var(--away)}
.cmp-bars i.lead{opacity:1}
.lineup-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.lineup-h.home{color:var(--home)}.lineup-h.away{color:var(--away)}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.prow:hover{background:var(--surface-2)}
.prow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.star{color:var(--rink-red);font-size:11px;font-weight:700;letter-spacing:.06em;margin-left:6px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
table.st th,table.st td{padding:8px 10px;text-align:right;border-top:1px solid var(--line)}
table.st thead th{border-top:0;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
table.st th:first-child,table.st td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.st tr.tot td{font-weight:700;background:var(--surface-2)}
table.st tr.tot td:first-child{background:var(--surface-2)}
table.st tr.grp td{background:var(--surface-2);font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left;font-size:13px}
table.st tr.grp.home td{color:var(--home)}table.st tr.grp.away td{color:var(--away)}
table.st td a{color:var(--fg);font-weight:600}
table.st th button{all:unset;cursor:pointer}
table.st th button:hover,table.st th button.on{color:var(--fg)}
table.st th button:focus-visible{outline:2px solid var(--rink-blue)}
table.st tbody tr:hover td{background:var(--surface-2)}
pre.json{margin:0;padding:14px 16px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:560px;white-space:pre;color:var(--fg)}
.danger-zone{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(6,12,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.ovl{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow:auto;border:1px solid var(--line)}
.sheet-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.sheet-h .nm{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<div id="app"></div>

(function(){

var MODE = {hockey:'Hockey', dodgepuck:'Dodgepuck', tag:'Tag'};
var ENDR = {EndOfRegulation:'Tiempo reglamentario', Overtime:'Prórroga', MercyRule:'Regla de piedad', Forfeit:'Abandono', Surrender:'Rendición', Tie:'Empate'};

/* ===== utilidades ===== */
function $(s, el){ return (el||document).querySelector(s); }

function r1(x){ return Math.round(x*10)/10; }
function fmtR(r){ return (Math.round(r*10)/10).toFixed(1); }
function rcls(r){ return r>=9?'elite':r>=8?'great':r>=7?'good':r>=6.5?'ok':r>=6?'meh':'bad'; }

function lab(k){ return LABELS[k] ? LABELS[k][0] : String(k).replace(/_/g,' ').replace(/^./, function(c){return c.toUpperCase();}); }
function short(k){ return LABELS[k] ? LABELS[k][1] : String(k).slice(0,4).toUpperCase(); }
function humanEnd(s){ if (!s) return ''; return ENDR[s] || String(s).replace(/([a-z])([A-Z])/g,'$1 $2'); }
function pct(x){ return Math.round(x*100)+' %'; }
function dec(x){ return (Math.round(x*10)/10).toFixed(1).replace('.',','); }
var DF_DAY = new Intl.DateTimeFormat('es-ES',{weekday:'long', day:'numeric', month:'short'});
var DF_DAYY = new Intl.DateTimeFormat('es-ES',{weekday:'long', day:'numeric', month:'short', year:'numeric'});
var DF_SHORT = new Intl.DateTimeFormat('es-ES',{day:'2-digit', month:'short'});
var DF_TIME = new Intl.DateTimeFormat('es-ES',{hour:'2-digit', minute:'2-digit'});

/* ===== lectura de JSON de Slapshot ===== */
function extractMatches(json){

function rawId(raw){

function teamOf(v){ var s = fold(v); if (s==='away'||s==='1'||s==='orange'||s==='red'||s==='visitante') return 'away'; return 'home'; }

  var id = rawId(raw);
  var t = Date.parse(raw.created || raw.created_at || raw.date || gs.created || gs.date || '') || Date.parse(entry.added || '') || 0;
  var players = plist.map(function(pl){
    var src = (pl.stats && typeof pl.stats==='object') ? pl.stats : pl;
    var st = {};
    Object.keys(src).forEach(function(k){
      if (/^(game_user_id|user_id|id|username|name|team|steam_id|stats)$/.test(k)) return;
      var n = num(src[k]); if (n != null) st[k] = n;
    });
    if (st.assists == null && (st.primary_assists != null || st.secondary_assists != null)) st.assists = (st.primary_assists||0)+(st.secondary_assists||0);

    var pid = String(pl.game_user_id != null ? pl.game_user_id : (pl.user_id != null ? pl.user_id : (pl.steam_id != null ? pl.steam_id : (pl.id != null ? pl.id : 'n:'+fold(pl.username||pl.name)))));

  });

function rate(st, res, ga, size){

  add('Paradas', st.saves, W.saves);
  add('Pases', st.passes, W.passes);
  add('Bloqueos', st.blocks, W.blocks);

/* ===== modelo ===== */
var DB;
function build(){

  matches.sort(function(a,b){ return b.t - a.t; });
  var players = new Map();
  matches.forEach(function(m){ m.players.forEach(function(p){
    var P = players.get(p.key);
    if (!P){ P = {key:p.key, pid:p.pid, name:p.name, lastT:-1, apps:[]}; players.set(p.key, P); }
    if (m.t > P.lastT){ P.lastT = m.t; P.name = (META.players[p.pid] && META.players[p.pid].n) || p.name; }
    P.apps.push({m:m, p:p});

function drawRankings(){

  }

  var mm = Object.keys(META.players).map(function(id){ var x = META.players[id]; return {id:id, x:x}; }).filter(function(o){ return o.x.mmr != null; }).sort(function(a,b){ return b.x.mmr-a.x.mmr; }).slice(0,8);

  el.innerHTML = '<div class="rk-grid">' + mmrBoard
    + board('Nota media', 'mín. '+minGp+' PJ', function(r){ return r.a.avg; }, function(x){ return badge(x); }, minF)

    + board('Goles', 'total', function(r){ return r.a.t.goals||0; }, v)
    + board('Asistencias', 'total', function(r){ return r.a.t.assists||0; }, v)
    + board('Goles + asistencias', 'total', function(r){ return (r.a.t.goals||0)+(r.a.t.assists||0); }, v)
    + board('Jugador del partido', 'veces MVP', function(r){ return r.a.mvp; }, v)

    + board('Bloqueos', 'total', function(r){ return r.a.t.blocks||0; }, v)
    + board('% de victorias', 'mín. '+minGp+' PJ', function(r){ return r.a.wp; }, function(x){ return v(pct(x)); }, minF)
    + board('Partidos jugados', 'total', function(r){ return r.a.gp; }, v)
    + '</div>';
}

/* ===== vista: cómo puntuamos ===== */
function viewMethod(){
  var rows = [['Base de partida', W.base.toFixed(1)], ['Gol', '+'+W.goals], ['Gol de la victoria (extra)', '+'+W.gwg], ['Asistencia primaria', '+'+W.pa], ['Asistencia secundaria', '+'+W.sa], ['Asistencia (si el JSON no separa tipos)', '+'+W.assists], ['Tiro', '+'+W.shots], ['Parada', '+'+W.saves], ['Pase', '+'+W.passes], ['Bloqueo', '+'+W.blocks], ['Robo', '+'+W.takeaways], ['Pérdida', String(W.turnovers)], ['Faceoff ganado', '+'+W.fw], ['Faceoff perdido', String(W.fl)], ['Poste', '+'+W.post], ['Posesión, por segundo (máx. +'+W.possCap+')', '+'+W.poss], ['Victoria', '+'+W.win], ['Derrota', String(W.loss)], ['Cada gol que encaja su equipo', String(W.ga)], ['Partidos 2v2: las acciones cuentan', '×0,8'], ['Partidos 1v1: las acciones cuentan', '×0,6']];
  MAIN.innerHTML = '<h1 class="h-page">Cómo puntuamos</h1><p class="sub">Cada jugador recibe una nota de 3 a 10 en cada partido, calculada solo con los datos del JSON.</p>'
    + '<div class="grid2"><div class="stack"><div class="card pad prose"><p>Todos empiezan en <strong>6,0</strong>. Cada acción suma o resta según su peso, se añade el resultado del partido y se resta un poco por cada gol que encaja su equipo, porque en Slapshot defienden todos. En 2v2 y 1v1 cada jugador acumula más acciones, así que ahí las acciones pesan menos para que las notas se puedan comparar entre formatos. La nota se redondea a un decimal y se limita entre 3 y 10.</p><p>El jugador con la nota más alta es el <strong>MVP</strong> del partido. La nota media de un jugador es la media de todas sus notas.</p><p class="muted">Las notas se recalculan cada vez que se abre la página, así que si se cambian los pesos se actualizan todos los partidos antiguos.</p></div>'
    + dataCard()
    + '<div class="card"><div class="card-h"><h3>Colores de nota</h3></div><div class="scale">'+[[9.2,'9,0 o más'],[8.4,'8,0 – 8,9'],[7.4,'7,0 – 7,9'],[6.7,'6,5 – 6,9'],[6.2,'6,0 – 6,4'],[5.5,'menos de 6,0']].map(function(x){ return '<div>'+badge(x[0])+'<span>'+x[1]+'</span></div>'; }).join('')+'</div></div></div>'
    + '<div class="card tscroll"><table class="st"><thead><tr><th>Acción</th><th>Peso</th></tr></thead><tbody>'+rows.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(String(r[1]).replace('.',','))+'</td></tr>'; }).join('')+'</tbody></table></div></div>';
}

function dataCard(){
  var t = (INDEX && INDEX.totals) || {}, lr = (INDEX && INDEX.lastRun) || {};
  return '<div class="card pad prose"><h2 class="h-sec">De dónde salen los datos</h2>'
    + '<p>Un robot consulta cada 30 minutos los perfiles públicos de <a href="https://slapshot.gg" target="_blank" rel="noopener">slapshot.gg</a>. Cada perfil da los últimos 10 partidos del jugador con todas sus estadísticas, y su rango y MMR de clasificatoria.</p>'
    + '<p>Cada jugador que aparece en un partido se añade a la lista y se revisa también; los más activos se miran más a menudo. Así se guardan casi todos los partidos que se juegan desde que empezó el rastreo. De antes solo hay los últimos 10 partidos de cada jugador.</p>'
    + '<p class="muted">Ahora mismo: '+(t.matches||0)+' partidos, '+(t.players||0)+' jugadores conocidos, '+(t.tracked||0)+' revisados. Última pasada '+(lr.at?esc(ago(Date.parse(lr.at))):'–')+': '+(lr.newMatches||0)+' partidos nuevos.</p></div>';
}
/* ===== utilidades de copia ===== */
function copyText(txt, el){
  function sel(){ try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo con Ctrl+C'); } catch(e){} }
  try { navigator.clipboard.writeText(txt).then(function(){ toast('JSON copiado'); }, sel); } catch(e){ sel(); }
}

/* ===== arranque ===== */
function loadData(){
  return fetch('data/index.json', {cache:'no-cache'}).then(function(r){
    if (!r.ok) throw new Error('Todavía no hay datos: el robot aún no ha hecho su primera pasada.');
    return r.json();
  }).then(function(idx){
    INDEX = idx; var v = '?v=' + encodeURIComponent(idx.updated || '');
    var jobs = [fetch('data/players.json'+v).then(function(r){ return r.ok ? r.json() : {players:{}}; })];
    (idx.shards || []).forEach(function(sh){ jobs.push(fetch('data/'+sh.file+v).then(function(r){ return r.ok ? r.json() : []; })); });
    return Promise.all(jobs);
  }).then(function(res){
    META = res[0] && res[0].players ? res[0] : {players:{}};
    var all = []; res.slice(1).forEach(function(arr){ (arr||[]).forEach(function(m){ all.push({raw:m, src:'slapshot.gg'}); }); });
    STATE.matches = all; STATE.updated = INDEX.updated;
  });
}
build();
route(true);
loadData().then(function(){ LOADED = true; build(); renderChrome(); route(true); }).catch(function(e){
  LOADED = true; build(); renderChrome();
  MAIN.innerHTML = '<div class="card empty"><p><strong>No se pudieron cargar los partidos.</strong></p><p>'+esc(e.message)+'</p></div>';
});
})();
</script>
</body>
</html>
